1:{tag:`ESCADINHA MÉTRICA`,title:`Pense nos prefixos como degraus`,rule:`km → hm → dam → m → dm → cm → mm. Cada passo para a direita multiplica por 10; para a esquerda divide por 10.`,memory:`Conte os degraus e mova a vírgula na mesma quantidade. Primeiro decida o sentido: unidade menor exige número maior.`,example:`2,4 km → m: são 3 degraus à direita. 2,4 × 1.000 = 2.400 m.`,items:[[`1,2 km → m`,1200,`m`], [`350 cm → m`,3.5,`m`], [`0,08 m → mm`,80,`mm`]]},
2:{tag:`REGRA DO QUADRADO`,title:`Área: o fator também fica ao quadrado`,rule:`Converta primeiro o comprimento e depois eleve o fator ao quadrado. m → cm é ×100; portanto m² → cm² é ×100² = ×10.000.`,memory:`Expoente 2 significa aplicar a conversão duas vezes: comprimento × comprimento. Não use a escadinha linear sem elevar o fator.`,example:`2,5 m² → cm²: 2,5 × 100² = 2,5 × 10.000 = 25.000 cm².`,items:[[`2,5 m² → cm²`,25000,`cm²`], [`45.000 mm² → m²`,0.045,`m²`], [`3 cm² → mm²`,300,`mm²`]]},
3:{tag:`ÂNCORAS DE FORÇA`,title:`Memorize as equivalências-chave`,rule:`Use 1 kgf = 9,80665 N e 1 tf = 9.806,65 N. Para estimativa mental, aproxime 1 kgf ≈ 10 N e 1 tf ≈ 10 kN; para resultado técnico, use o fator exato.`,memory:`kN para N: ×1.000. kgf para N: ×9,80665. tf para kN: ×9,80665. Identifique se a questão pede aproximação ou precisão.`,example:`2 kN → N = 2 × 1.000 = 2.000 N.`,items:[[`2 kN → N`,2000,`N`], [`50 kgf → N`,490.3325,`N`], [`1 tf → kN`,9.80665,`kN`]]},
4:{tag:`PONTE DA TENSÃO`,title:`Use a relação entre MPa e N/mm²`,rule:`A equivalência mais útil em resistência dos materiais é 1 MPa = 1 N/mm². Também: 1 MPa = 1.000 kPa = 1.000.000 Pa.`,memory:`Quando aparecer N/mm², leia diretamente como MPa. Para Pa, kPa e MPa, cada prefixo muda por fator 1.000.`,example:`2 MPa → N/mm² = 2 N/mm², sem fazer conta.`,items:[[`2 MPa → N/mm²`,2,`N/mm²`], [`300 kPa → MPa`,0.3,`MPa`], [`1 kgf/cm² → Pa`,98066.5,`Pa`]]},

8:{tag:`DUAS FAMÍLIAS`,title:`Separe energia de potência`,rule:`Energia: 1 kWh = 3.600.000 J e 1 cal ≈ 4,184 J. Potência: 1 kW = 1.000 W; 1 cv ≈ 735,5 W. Não misture energia (J, kWh) com potência (W, kW).`,memory:`Veja primeiro se a unidade mede energia ou potência. Em seguida use a âncora da família: kWh↔J ou kW↔W.`,example:`2 kW → W = 2 × 1.000 = 2.000 W.`,items:[[`1,5 kWh → J`,5400000,`J`], [`500 cal → J`,2092,`J`], [`2 kW → W`,2000,`W`]]},

/* =========================================================================

const CAMP_KEY = 'engconvert:campaign:v1';
const TRICKS_KEY = 'engconvert:tricks:v1';

/* --- Banco de Definições da Campanha --- */
const defs = {
  'Comprimento': { units: [['mm', .001], ['cm', .01], ['m', 1], ['km', 1000]], rule: 'Comprimento é escala linear: cada mudança entre mm, cm, m e km move a vírgula proporcionalmente a potências de 10.' },
  'Área': { units: [['mm²', 1e-6], ['cm²', 1e-4], ['m²', 1]], rule: 'Área é comprimento ao quadrado: se 1 m = 100 cm, então 1 m² = (100 cm)² = 10.000 cm².' },
  'Volume': { units: [['cm³', 1e-6], ['L', .001], ['m³', 1]], rule: 'Volume é comprimento ao cubo: se 1 m = 10 dm, então 1 m³ = 1.000 dm³ = 1.000 L.' },
  'Força': { units: [['N', 1], ['kN', 1000], ['kgf', 9.80665], ['tf', 9806.65]], rule: 'Use as âncoras essenciais: 1 kN = 1.000 N; 1 kgf ≈ 9,81 N; 1 tf ≈ 10 kN (9,807 kN).' },
  'Tensão': { units: [['Pa', 1], ['kPa', 1000], ['MPa', 1e6], ['GPa', 1e9], ['N/mm²', 1e6], ['kgf/cm²', 98066.5]], rule: 'Tensão é força sobre área: 1 MPa = 1 N/mm² (exatamente 1:1); 1 kgf/cm² ≈ 100 kPa ≈ 0,1 MPa.' },
  'Momento Fletor': { units: [['N·mm', .001], ['N·m', 1], ['kN·m', 1000], ['kgf·m', 9.80665], ['tf·m', 9806.65]], rule: 'Momento = força × distância: 1 kN·m = (1.000 N) × (1.000 mm) = 1.000.000 N·mm (10⁶ N·mm).' },

  'Pressão': { units: [['Pa', 1], ['kPa', 1000], ['MPa', 1e6], ['bar', 1e5], ['atm', 101325]], rule: 'Pressão: 1 bar = 100.000 Pa = 100 kPa; 1 atm = 101,3 kPa ≈ 1,013 bar.' },
  'Energia & Potência': { units: [['J', 1], ['kJ', 1000], ['kWh', 3600000], ['W', 1], ['kW', 1000], ['cv', 735.5]], rule: '1 kWh = 1.000 W × 3.600 s = 3,6 MJ; 1 cv ≈ 735,5 W.' },
  'Notação Científica': { sci: true, rule: 'Deixe um dígito de 1 a 9 antes da vírgula e conte o deslocamento das casas como expoente de 10.' }
};

const priority = ['Força', 'Tensão', 'Momento Fletor'];
const levels = [
  ['Fundamentos', 'Valores simples e conversões diretas de base.'],
  ['Intermediário', 'Números decimais e sentido inverso das unidades.'],
  ['Avançado', 'Prefixos de engenharia e relações compostas.'],
  ['Desafio', 'Agilidade com casas decimais e tempo reduzido.'],
  ['Mestria', 'Precisão absoluta sem auxílio de calculadora.']
];

/* --- Estado e Persistência da Campanha --- */
let campState = {};
try { campState = JSON.parse(localStorage.getItem(CAMP_KEY) || '{}'); } catch {}
const saveCamp = () => {
  try {
    localStorage.setItem(CAMP_KEY, JSON.stringify(campState));
    localStorage.setItem(CAMP_KEY + ':backup', JSON.stringify({ state: campState, time: Date.now() }));
  } catch {}
};
window.addEventListener('pagehide', saveCamp);
window.addEventListener('beforeunload', saveCamp);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveCamp(); });

const stars = (c, l) => Number(campState[c]?.levels?.[l]?.stars || 0);
const unlocked = (c, l) => l === 1 || stars(c, l - 1) >= 2;
const totalStars = () => Object.keys(defs).reduce((acc, c) => acc + [1, 2, 3, 4, 5].reduce((a, l) => a + stars(c, l), 0), 0);

/* --- Banco do Math Tricks Workout --- */
const tricksBank = [
  {
    q: 'Quanto vale exatamente 1 MPa em N/mm²?',
    ans: ['1', '1.0', '1,0'],
    display: '1 N/mm²',

try { tricksState = Object.assign(tricksState, JSON.parse(localStorage.getItem(TRICKS_KEY) || '{}')); } catch {}

  try { localStorage.setItem(TRICKS_KEY, JSON.stringify(tricksState)); } catch {}
};

/* --- Efeitos Sonoros / Áudio Sintetizado --- */
let audioCtx = null;
const playBeep = (freq = 440, type = 'sine', duration = 0.08) => {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch {}
};

const haptic = (ms = 15) => {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch {}

/* --- Lógica de Injeção de Teclas com Suporte ao React --- */
function setNativeValue(element, value) {
  const valueSetter = Object.getOwnPropertyDescriptor(element, 'value')?.set;
  const prototype = Object.getPrototypeOf(element);
  const prototypeValueSetter = Object.getOwnPropertyDescriptor(prototype, 'value')?.set;
  if (prototypeValueSetter && valueSetter !== prototypeValueSetter) {
    prototypeValueSetter.call(element, value);
  } else if (valueSetter) {
    valueSetter.call(element, value);
  } else {
    element.value = value;
  }
  element.dispatchEvent(new Event('input', { bubbles: true }));
  element.dispatchEvent(new Event('change', { bubbles: true }));
}

function getTargetInput() {
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') && !active.disabled && active.type !== 'hidden') {
    return active;
  }
  return document.querySelector('input:not([type="hidden"]):not([disabled])');
}

keypad.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-k]');
  if (!btn) return;
  e.preventDefault();
  playBeep(700, 'triangle', 0.04);
  haptic(12);

  const k = btn.dataset.k;
  const input = getTargetInput();
  if (!input) return;

  let val = input.value || '';
  if (k === 'clear') {
    setNativeValue(input, '');
  } else if (k === 'backspace') {
    setNativeValue(input, val.slice(0, -1));
  } else if (k === 'sign') {
    if (val.startsWith('-')) setNativeValue(input, val.slice(1));
    else setNativeValue(input, '-' + val);
  } else if (k === 'sci') {
    if (!val.includes('× 10^') && !val.includes('e')) {
      setNativeValue(input, val + ' × 10^');
    }
  } else if (k === 'enter') {
    playBeep(880, 'sine', 0.08);
    const form = input.closest('form') || document.querySelector('form');
    if (form) {
      const submitBtn = form.querySelector('button[type="submit"], button.bg-cta, button.btn, #ec-submit, #ec-workout-submit');
      if (submitBtn) submitBtn.click();
      else if (form.requestSubmit) form.requestSubmit();
      else form.dispatchEvent(new Event('submit', { bubbles: true }));
    }
  } else {
    setNativeValue(input, val + k);
  }
  input.focus();
});

function genQuestion(c, l, s) {
  const def = defs[c];
  if (def.sci) {
    const exp = Math.floor(Math.random() * 9) - 4;
    const base = Number((Math.random() * 8.9 + 1).toFixed(1));
    const full = base * Math.pow(10, exp);
    return {
      txt: `Converta para notação científica: ${full}`,
      prompt: `${full} = `,
      ans: `${base} × 10^${exp}`,
      rule: 'Deixe apenas 1 algarismo não-nulo antes da vírgula.'
    };
  }

  const u = def.units;
  const i1 = Math.floor(Math.random() * u.length);
  let i2 = Math.floor(Math.random() * u.length);
  while (i2 === i1) i2 = Math.floor(Math.random() * u.length);

  const [u1, f1] = u[i1];
  const [u2, f2] = u[i2];
  const val = Number((Math.random() * (l > 2 ? 50 : 20) + 1).toFixed(l > 1 ? 1 : 0));
  const res = (val * f1) / f2;
  const resFmt = Number(res.toFixed(4));

  return {
    txt: `Converta: quanto vale ${val} ${u1} em ${u2}?`,
    prompt: `${val} ${u1} = `,
    targetUnit: u2,
    ans: String(resFmt),
    rule: def.rule
  };
}

      <div class="quiz-box">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:12px;font-weight:800;color:#c084fc;text-transform:uppercase;">MACETE MENTAL</span>
          <span style="font-size:12px;font-weight:700;background:rgba(255,255,255,0.08);padding:3px 8px;border-radius:6px;color:#94a3b8;">${esc(q.hint)}</span>
        </div>

        <div class="quiz-q">${esc(q.q)}</div>

        <form id="ec-workout-form" onsubmit="return false;">
          <input type="text" id="ec-workout-val" class="quiz-input" placeholder="Sua resposta..." autocomplete="off" autofocus inputmode="decimal">
          <button type="submit" id="ec-workout-submit" class="quiz-submit">Responder ↵</button>
        </form>
      </div>
    </div>
  `;

  setTimeout(() => {
    const inp = document.getElementById('ec-workout-val');
    if (inp) inp.focus();
  }, 50);

  document.getElementById('ec-workout-form').onsubmit = (e) => {
    e.preventDefault();
    const inp = document.getElementById('ec-workout-val');
    const user = (inp.value || '').trim().replace(',', '.').replace(/\s+/g, '');
    const isOk = q.ans.some(a => a.replace(',', '.').replace(/\s+/g, '') === user);

    if (isOk) {
      tricksStreak++;
      tricksScore += 100 * tricksStreak;
      playBeep(880, 'sine', 0.1);
      haptic(20);
    } else {
      tricksStreak = 0;
      playBeep(220, 'sawtooth', 0.15);
      haptic(40);
    }

    // Exibe tela intermediária de feedback da questão
    renderWorkoutFeedback(isOk, q, user);
  };
}

function renderWorkoutFeedback(isOk, q, user) {
  modal.innerHTML = `
    <div class="wrap">
      <div class="header">
        <div class="title">🧠 Feedback do Macete</div>
        <span style="font-size:13px;color:#94a3b8;">Questão ${tricksIdx + 1} de 10</span>
      </div>

      <div class="quiz-box">
        <div style="font-size:32px;margin-bottom:8px;">${isOk ? '✅' : '❌'}</div>
        <div style="font-size:20px;font-weight:800;color:${isOk ? '#4ade80' : '#f87171'};">
          ${isOk ? 'Exato! Mandou muito bem!' : 'Ops! Resposta esperada: ' + esc(q.display)}
        </div>

        <div style="background:rgba(255,255,255,0.06);border-radius:12px;padding:14px;margin:16px 0;font-size:14px;line-height:1.5;">
          <b>Por que funciona assim:</b><br>
          ${esc(q.trick)}
        </div>

        <button class="quiz-submit" id="ec-workout-next">
          ${tricksIdx + 1 < tricksQs.length ? 'Próxima Questão ➔' : 'Ver Resultado Final 🏆'}
        </button>
      </div>
    </div>
  `;

  document.getElementById('ec-workout-next').onclick = () => {
    tricksIdx++;
    if (tricksIdx < tricksQs.length) {
      renderWorkoutQuestion();
    } else {
      renderWorkoutResult();
    }
  };
}

function renderWorkoutResult() {
  if (tricksScore > tricksState.bestScore) tricksState.bestScore = tricksScore;
  if (tricksStreak > tricksState.bestStreak) tricksState.bestStreak = tricksStreak;
  tricksState.runs = (tricksState.runs || 0) + 1;
  saveTricks();

  modal.innerHTML = `
    <div class="wrap">
      <div class="header">
        <div class="title">🏆 Workout Finalizado!</div>
        <button class="btn-back" data-act="exit-to-menu">← Voltar às Fases</button>
      </div>

      <div class="quiz-box" style="text-align:center;">
        <div style="font-size:42px;margin-bottom:8px;">⚡</div>
        <div style="font-size:24px;font-weight:800;color:#c084fc;">
          Pontuação Final: ${tricksScore} pts
        </div>
        <div style="font-size:14px;color:#94a3b8;margin:8px 0 20px;">
          Seu melhor recorde: <b>${tricksState.bestScore} pts</b>
        </div>

        <button class="quiz-submit" data-act="start-workout" style="margin-bottom:10px;">
          ⚡ Fazer Outro Workout
        </button>
        <button class="btn-back" data-act="exit-to-menu" style="width:100%;justify-content:center;padding:12px;">
          ← Voltar ao Menu de Fases
        </button>
      </div>
    </div>
  `;
}

/* =========================================================================
   MÓDULO 3: UNIFICAÇÃO DA NAVEGAÇÃO NO MENU PRINCIPAL DO REACT
   ========================================================================= */

function ensureModeNav() {
  // Procura se o menu principal do React já montou no DOM
  const root = document.getElementById('root');
  if (!root) return;

  const headerStats = root.querySelector('.safe-pad .flex.flex-wrap');
  if (headerStats && !document.getElementById('eng-mode-nav-bar')) {
    const nav = document.createElement('div');
    nav.id = 'eng-mode-nav-bar';
    nav.className = 'eng-mode-nav';
    nav.innerHTML = `
      <button type="button" class="eng-mode-btn ${activeMode === 'fases' ? 'active' : ''}" data-mode="fases">
        ⚡ Fases Rápidas
      </button>
      <button type="button" class="eng-mode-btn ${activeMode === 'campanha' ? 'active' : ''}" data-mode="campanha">
        🏆 Trilha de Domínio
      </button>
      <button type="button" class="eng-mode-btn ${activeMode === 'tricks' ? 'active' : ''}" data-mode="tricks">
        🧠 Math Tricks Workout
      </button>
    `;
    headerStats.parentNode.insertBefore(nav, headerStats.nextSibling);

    nav.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-mode]');
      if (!btn) return;
      const m = btn.dataset.mode;
      switchMode(m);
    });
  }
}

function switchMode(m) {
  activeMode = m;
  document.querySelectorAll('.eng-mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === m);
  });

  if (m === 'fases') {
    modal.hidden = true;
  } else if (m === 'campanha') {
    campHome();
  } else if (m === 'tricks') {
    tricksHome();
  }
}

// Observa mutações para reinjetar a barra se o React re-renderizar a Home
const observer = new MutationObserver(() => {
  ensureModeNav();
});
observer.observe(document.body, { childList: true, subtree: true });
setInterval(ensureModeNav, 1000);

/* --- Manipulador de Cliques Gerais do Modal --- */
modal.addEventListener('click', (e) => {
  const catCard = e.target.closest('[data-cat]');
  if (catCard) {
    cat = catCard.dataset.cat;
    campCategory();
    return;
  }

  const lvlCard = e.target.closest('[data-level]');
  if (lvlCard) {
    level = Number(lvlCard.dataset.level);
    star = Math.min(3, stars(cat, level) + 1);
    campLearn();
    return;
  }

  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;

  if (act === 'exit-to-menu') {
    modal.hidden = true;
    switchMode('fases');
  } else if (act === 'camp-home') {
    campHome();
  } else if (act === 'camp-cat') {
    campCategory();
  } else if (act === 'start-round') {
    startCampRound();
  } else if (act === 'next-star') {
    star = Math.min(3, star + 1);
    campLearn();
  } else if (act === 'retry-round') {
    startCampRound();
  } else if (act === 'tricks-home') {
    tricksHome();
  } else if (act === 'start-workout') {
    startWorkoutRound();
  }
});

})();

</script></body></html>
